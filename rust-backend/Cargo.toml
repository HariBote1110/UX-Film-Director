[package]
name = "uxfd-rust-backend"
version = "0.1.0"
edition = "2021"

[dependencies]
base64 = "0.22"
crc32fast = "1.5"
flate2 = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uxfd-sidecar-protocol = { path = "../sidecar-protocol" }

[target.'cfg(unix)'.dependencies]
uxfd-shared-memory-spike = { path = "../shared-memory-spike" }

[dev-dependencies]
uxfd-shared-memory-spike = { path = "../shared-memory-spike" }
