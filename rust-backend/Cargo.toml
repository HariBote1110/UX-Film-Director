[package]
name = "uxfd-rust-backend"
version = "0.1.0"
edition = "2021"

[dependencies]
cosmic-text = "0.19.0"
crc32fast = "1.5"
flate2 = "1"
pollster = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uxfd-golden-harness = { path = "../golden-harness" }
uxfd-native-wgpu-renderer = { path = "../native-wgpu-renderer" }
uxfd-rust-core = { path = "../rust-core" }
uxfd-sidecar-protocol = { path = "../sidecar-protocol" }

[target.'cfg(unix)'.dependencies]
uxfd-shared-memory-spike = { path = "../shared-memory-spike" }

[target.'cfg(target_os = "macos")'.dependencies]
uxfd-macos-video-decode = { path = "../macos-video-decode" }

[dev-dependencies]
uxfd-shared-memory-spike = { path = "../shared-memory-spike" }
