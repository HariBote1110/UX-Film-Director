[package]
name = "uxfd-native-overlay"
version = "0.1.0-Alpha-1a"
edition = "2021"
build = "build.rs"

[lib]
name = "uxfd_native_overlay"
# "rlib" を追加したのは Windows_Port_Plan.md Phase 5（W5）の実機スモークテスト
# （tests/win32_overlay_smoke.rs）が `uxfd_native_overlay::attach_native_overlay`
# 等をライブラリとして呼ぶため。napi addon としての "cdylib" 出力は変わらない。
crate-type = ["cdylib", "rlib"]

[dependencies]
napi = "3.9.2"
napi-derive = "3.5.6"
pollster = "0.3"
raw-window-handle = "0.6"
serde_json = "1.0"
uxfd-shared-video-frame-bridge = { path = "../shared-video-frame-bridge" }
uxfd-native-wgpu-renderer = { path = "../native-wgpu-renderer" }
uxfd-golden-harness = { path = "../golden-harness" }
uxfd-rust-core = { path = "../rust-core" }
uxfd-rust-backend = { path = "../rust-backend" }
wgpu = "25"

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics-types = "0.1.3"
metal = "0.31.0"
objc = "0.2.7"
url = "2"
uxfd-macos-video-decode = { path = "../macos-video-decode" }

# Windows native overlay（Windows_Port_Plan.md Phase 5 / ADR-012）:
# `win32_overlay.rs` が owner HWND の取得・overlay WS_POPUP window の作成・
# DirectComposition device/target/visual のセットアップに使う。
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_DirectComposition",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_LibraryLoader",
] }

[dev-dependencies]
uxfd-shared-memory-spike = { path = "../shared-memory-spike" }

[build-dependencies]
napi-build = "2.3.2"
