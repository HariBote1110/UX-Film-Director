[package]
name = "uxfd-rust-core-wasm"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6"
uxfd-rust-core = { path = "../rust-core" }
wasm-bindgen = "0.2"

[profile.release]
opt-level = 3
lto = true
