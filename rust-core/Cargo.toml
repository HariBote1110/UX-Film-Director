[package]
name = "uxfd-rust-core"
version = "0.1.0"
edition = "2021"

[lib]
name = "uxfd_rust_core"
path = "src/lib.rs"

[dependencies]
schemars = "1.2.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ts-rs = { version = "12.0.1", features = ["serde-json-impl"] }

[dev-dependencies]
proptest = "1.6"
