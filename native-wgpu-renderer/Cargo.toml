[package]
name = "uxfd-native-wgpu-renderer"
version = "0.1.0"
edition = "2021"

[lib]
name = "uxfd_native_wgpu_renderer"

[dependencies]
bytemuck = { version = "1.16", features = ["derive"] }
half = "2"
pollster = "0.3"
raw-window-handle = "0.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uxfd-golden-harness = { path = "../golden-harness" }
uxfd-reference-renderer = { path = "../reference-renderer" }
uxfd-rust-core = { path = "../rust-core" }
uxfd-shared-memory-spike = { path = "../shared-memory-spike" }
uxfd-sidecar-protocol = { path = "../sidecar-protocol" }
wgpu = "25"

# Phase 4b (NV12 IOSurface import): wgpu-hal 25.0.2 の metal backend が
# 内部で使う `metal`/`objc` と同一バージョンに固定し、重複クレートを
# 避ける（詳細: progress/phase4b-nv12-iosurface-gpu-import.md）。
# wgpu 30 以降は Metal バインディングが objc2 系へ移るため、この固定は
# 25 系でのみ成立する（wgpu24_nv12_research/notes/h3-wgpu25-vs-wgpu30.md）。
[target.'cfg(target_os = "macos")'.dependencies]
metal = "0.31"
objc = "0.2.7"

# Windows native overlay（Windows_Port_Plan.md Phase 5 / ADR-012）:
# `from_hwnd` が DirectComposition の `IDCompositionDevice` / `IDCompositionVisual`
# を扱うために必要。probe-sustained（windows_port_research/tools/probe-sustained）
# が windows 0.58 で実機検証済みだが、本クレートは他の依存と揃え 0.58 系に固定する。
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Graphics_DirectComposition",
    "Win32_Foundation",
] }

[dev-dependencies]
tempfile = "3.14"
uxfd-decode-spike = { path = "../decode-spike" }

# NV12 テストフィクスチャ（synthetic IOSurface-backed CVPixelBuffer）構築用。
# `core-graphics-types`（`metal` crate 経由）が要求する core-foundation 0.9
# 系に揃え、production 依存では重複を避けるため dev-dependencies のみに
# 限定する。
[target.'cfg(target_os = "macos")'.dev-dependencies]
core-foundation = "0.9"
