[package]
name = "uxfd-macos-video-decode"
version = "0.1.0"
edition = "2021"

[lib]
name = "uxfd_macos_video_decode"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-core-foundation = "0.3.2"
objc2-core-media = "0.3.2"
objc2-foundation = "0.3.2"
objc2-io-surface = "0.3.2"

[target.'cfg(target_os = "macos")'.dependencies.objc2-av-foundation]
version = "0.3.2"
features = ["objc2-core-media"]

[target.'cfg(target_os = "macos")'.dependencies.objc2-core-video]
version = "0.3.2"
features = ["objc2-io-surface"]

[dev-dependencies]
tempfile = "3.14"
